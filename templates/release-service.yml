spec:
  inputs:
    job-name:
      default: "release-service"
      description: "Name for the job"
    job-stage:
      default: "deploy"
      description: "Stage to run the job"
    dist-job-name:
      description: "The name of the job that produced the dist tarball in your pipeline"
    tarball-artifact-path:
      default: "public-dist"
      description: "The path of the exported tarball"
    service-url:
      default: "https://gnome-release-route-gnome-release-service.apps.openshift.gnome.org"
      options:
      # Uploads to https://download.gnome.org/sources/
      - "https://gnome-release-route-gnome-release-service.apps.openshift.gnome.org"
      # Artifacts can be inspected at https://gnome-release-route-sandbox-fileserver-gnome-release-service.apps.openshift.gnome.org/
      - "https://gnome-release-route-sandbox-gnome-release-service.apps.openshift.gnome.org"
      description: "The end-point of the service. Publishes by default, or you can choose to use the test (sandbox) server instead."
---
"$[[ inputs.job-name ]]":
  image: "registry.gitlab.com/gitlab-org/release-cli:latest"
  stage: $[[ inputs.job-stage ]]
  tags:
    - gnome-release-service
  needs:
    - job: $[[ inputs.dist-job-name ]]
      artifacts: true
  retry:
    max: 2
    when:
      - "runner_system_failure"
      - "stuck_or_timeout_failure"
      - "scheduler_failure"
      - "api_failure"
  variables:
    GNOME_RELEASE_SERVICE_API_URL: "$[[ inputs.service-url ]]"
    GNOME_RELEASE_SERVICE_API_INSTALL_MODULE_RELEASE_ENDPOINT: "$GNOME_RELEASE_SERVICE_API_URL/install-module-release"
  id_tokens:
    JWT_TOKEN:
      # Scoped to the chosen service so a token sent to the sandbox can't be used on production
      aud: "$[[ inputs.service-url ]]"
  before_script: []
  script:
    # The image is alpine (busybox ash); the scripts below need bash
    - apk add --no-cache bash curl git
    - ls -al "$[[ inputs.tarball-artifact-path ]]"

    # https://gitlab.com/gitlab-org/gitlab/-/issues/382536
    - echo "Fixing up release tag message for gitlab"
    - >-
      if [[ "$RELEASE_GIT_REF" == "$CI_COMMIT_TAG" ]]; then
          a=$(git tag -l "$CI_COMMIT_TAG" --format='%(contents)')
      elif [[ "$RELEASE_GIT_REF" == "$CI_COMMIT_SHA" ]]; then
          a=$(git show -s --format='%B')
      else
        echo "Unexpected"
        exit 1
      fi

    - tag_msg=$(printf '%s\n' "${a%%-----BEGIN*}")
    - echo "$tag_msg"

    - |-
      cat > upload.sh <<'EOF'
      #! /bin/bash
      set -eu
      shopt -s nullglob

      _path="$1"

      # The token is passed through a file descriptor so it never appears in the process list.
      # Retries cover the service restarting during a deploy (connection refused, 502/503);
      # client errors such as 400 or 403 are not retried.
      upload () {
          echo "Uploading $1"
          curl --fail-with-body --retry 5 --retry-delay 10 --retry-connrefused \
              -H @<(printf 'Authorization: Bearer %s\n' "$JWT_TOKEN") \
              -F "tarball=@$1" \
              "$GNOME_RELEASE_SERVICE_API_INSTALL_MODULE_RELEASE_ENDPOINT"
      }

      # Upload the first tarball in the public-dist directory that has a sha256sum next to it
      upload_from_public_dist () {
          for _file in public-dist/*.tar.{xz,gz}; do
              if [[ -f "$_file" && -f "$_file.sha256sum" ]]; then
                  upload "$_file"
                  return 0
              fi
          done

          echo "Failed to find any files to upload"
          return 1
      }

      # If the value is set to default "public-dist", use it as a clue to
      # look for the tarballs in that exported directory.
      # Otherwise fallback to the old behavior where the tarball is passed
      # by absolute path through tarball-artifact-path
      if [[ "$_path" == "public-dist" ]]; then
          upload_from_public_dist
      else
          upload "$_path"
      fi
      EOF

    - bash ./upload.sh "$[[ inputs.tarball-artifact-path ]]"

    # Only production tag pipelines set RELEASE_GIT_REF to the tag (see rules), so
    # testing against the sandbox never creates a GitLab release
    - >-
      if [[ "$RELEASE_GIT_REF" == "$CI_COMMIT_TAG" ]]; then
        echo "Creating release for tag: $CI_COMMIT_TAG"
        glab auth login --hostname "$CI_SERVER_HOST" --job-token "$CI_JOB_TOKEN"
        glab release create "$RELEASE_GIT_REF" --notes "$tag_msg" --tag-message "$tag_msg"
      fi
  after_script: []
  rules:
    # Production: protected tags only. CI_COMMIT_REF_PROTECTED is "false" (not empty)
    # on unprotected refs, so compare it explicitly.
    - if: '"$[[ inputs.service-url ]]" == "https://gnome-release-route-gnome-release-service.apps.openshift.gnome.org" && $CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"'
      variables:
        RELEASE_GIT_REF: "$CI_COMMIT_TAG"
    # Sandbox: any branch or tag, in GNOME and its subgroups (e.g. GNOME/Incubator),
    # where the tagged runner is available
    - if: '"$[[ inputs.service-url ]]" == "https://gnome-release-route-sandbox-gnome-release-service.apps.openshift.gnome.org" && $CI_PROJECT_NAMESPACE =~ /^GNOME(\/|$)/'
      variables:
        RELEASE_GIT_REF: "$CI_COMMIT_SHA"
