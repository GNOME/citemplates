include:
  - project: "GNOME/citemplates"
    file: "templates/default-rules.yml"

.flatpak:
  image: 'quay.io/gnome_infrastructure/gnome-runtime-images:gnome-master'
  stage: 'test'
  interruptible: true
  variables:
    LANG: "C.UTF-8"
    # Force Software rendering for GL and Vulkan so the tests run locally
    LIBGL_ALWAYS_SOFTWARE: true
    # This the hardcoded value for llvmpipe
    MESA_VK_DEVICE_SELECT: "10005:0"
    # Set to anything else to skip tests
    RUN_TESTS: "1"
    # vala is still using autotools, otherwise there is no reason
    # to skip dist
    MESON_DIST: "1"
    # Pass "--runtime" in order to build a runtime or extension
    EXPORT_RUNTIME: ""
    # This has a misleading name cause it was used before adding
    # the non-runtime --repo-url arg
    NIGHTLY_REPO: "https://nightly.gnome.org/gnome-nightly.flatpakrepo"
    NIGHTLY_REPO_NONFILE: "https://nightly.gnome.org/repo/"
    PULL_CACHE: "1"
    PUBLISH_CACHE: "1"
    _ORAS_CACHE_REGISTRY: "quay.io"
    _ORAS_CACHE_REPOSITORY: "gnome_infrastructure/gnome-nightly-cache"
    # Default for backwards compatibility
    ARCH: "x86_64"
    ADD_GITLAB_METADATA: "1"
  # Till now this was the template job used for everything,
  # so assume its default tags are x86 to avoid breaking backwards
  # compatibility.
  tags:
    - flatpak
  script:
    # By only using the script in the image, we can also tie any changes
    # to the scripts to the image versions, and avoid issues where we
    # changed the template/scripts but the image was not yet published
    - bash /usr/lib/citemplates/flatpak-job.sh
  artifacts:
    name: 'Flatpak artifacts'
    when: 'always'
    paths:
      - $BUNDLE
      - "*.flatpak"
      - 'repo.tar'
      - "${CI_PROJECT_NAME}-docs.tar.gz"
      - '.flatpak-builder/build/**/_flatpak_build/meson-logs/'
      - '.flatpak-builder/build/**/_flatpak_build/meson-dist/'
      - 'public-dist'
    reports:
      junit: ".flatpak-builder/build/${FLATPAK_MODULE}*/_flatpak_build/meson-logs/testlog*.junit.xml"
    expire_in: "2 days"

.flatpak@x86_64:
  extends: '.flatpak'
  variables:
    ARCH: "x86_64"
  tags:
    - flatpak

.flatpak@aarch64:
  extends: '.flatpak'
  variables:
    ARCH: "aarch64"
  tags:
    - flatpak-aarch64

.publish_nightly:
  image:
    name: "ghcr.io/flathub/flatpak-builder-lint:latest"
    entrypoint: [""]
  stage: 'deploy'
  timeout: '100m'
  script:
    # Make sure old/leftover variables don't affect us
    - unset REPO_TOKEN

    - tar xf repo.tar
    - BUILD_ID=$(flat-manager-client --token-file "${REPO_TOKEN_FILE}" create "${FLAT_MANAGER_URL}" "${FLATPAK_REPO}")
    - flat-manager-client --token-file "${REPO_TOKEN_FILE}" push --commit --publish --wait "${BUILD_ID}" repo/ || result=$?
    - if [ "$result" != 0 ]; then flat-manager-client --token-file "${REPO_TOKEN_FILE}" purge "${BUILD_ID}"; fi
    - exit $result
  variables:
    FLAT_MANAGER_URL: https://flat-manager.gnome.org/
    FLATPAK_REPO: nightly
  rules:
    - if: ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main") && $REPO_TOKEN_FILE

token-check:
  image: 'ubuntu:latest'
  stage: '.pre'
  needs: []
  script:
    - |
      echo "System Notice!!"
      echo "Due to security reason we had to switch the name and type of the REPO_TOKEN variable used to publish in gnome-nightly Flatpak repository"
      echo "In order to fix this, please navigate to Project -> Settings -> CI/CD -> Variables"
      echo "Or click here ${CI_PROJECT_URL}/-/settings/ci_cd#js-cicd-variables-settings"
      echo "Find the variable named \`REPO_TOKEN\`. It will have a \`Environment Variable\` type set atm. Switch it to \`File Variable\` and rename it to \`REPO_TOKEN_FILE\`"
      echo "Now you should be able to trigger a new pipeline, retrying the job alone will not work, and publishing should work again."
    - exit 1
  rules:
    - if: $REPO_TOKEN && ($REPO_TOKEN_FILE == null)
