.base_template:
  image: "quay.io/buildah/stable:latest"
  variables:
    STORAGE_DRIVER: "vfs"
    BUILDAH_FORMAT: "docker"
    BUILDAH_ISOLATION: "chroot"
  rules:
    - if:
      changes:
        paths:
          - runtime-images/**/*
    # Otherwise manual
    # We trigger this build for both flatpak and runtime-images to
    # satisfy the job dependency and be more flexible with needs:
    # But we don't need to rebuild automatically without changes
    # in the runtime-images
    - if: $CI_COMMIT_SHA
      when: "manual"
      allow_failure: true

.base_image:
  stage: "CI Runtime Images"
  extends: ".base_template"
  before_script: []
  after_script: []
  needs: []
  script:
    - bash ./runtime-images/scripts/build-image.sh

base:
  extends: ".base_image"
  variables:
    ARCH: x86_64

base:aarch64:
  extends: ".base_image"
  tags:
    - aarch64
  variables:
    ARCH: aarch64

base-manifest:
  extends: ".base_template"
  stage: "CI Runtime Images"
  script:
    - bash ./runtime-images/scripts/make-manifest.sh "base"
  needs:
    - job: "base"
      artifacts: false
    - job: "base:aarch64"
      artifacts: false
