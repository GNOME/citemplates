include:
  # Testing the local templates
  - local: "flatpak/flatpak_ci_initiative.yml"

  # For the tarball dist test
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/release-service@$CI_COMMIT_SHA
    inputs:
      job-name: "release-service-flatpak"
      dist-job-name: "test-flatpak-dist"
      service-url: "https://gnome-release-route-sandbox-gnome-release-service.apps.openshift.gnome.org"

.upstream-image: &upstream
  needs: []
  variables:
    _IMAGE: "quay.io/gnome_infrastructure/gnome-runtime-images:gnome-master"

.forked-image-rebuild: &fork
  variables:
    _IMAGE: "$CI_REGISTRY_IMAGE:gnome-master-$CI_COMMIT_REF_SLUG"
  needs:
    - job: "gnome-manifest:master"
      optional: true
      artifacts: false

# This rules triggers for changes in both runtime-images and flatpak as we want to
# run the tests in either case, but only in one of them we need to rebuild the image
# to test it, as the other one only changes the template.
.custom image policy:
  stage: "Flatpak app"
  rules:
    # These rules are in order, cause we always want quay on default branch upstream
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PROJECT_NAMESPACE == "GNOME"
      <<: *upstream
    # If there are changes in the image, use that, as it should have been also triggered
    # to build.
    - if:
      changes:
        paths:
          - "runtime-images/**/*"
      <<: *fork
    # Otherwise, catchall rule, use the upstream image again
    - if: $CI_COMMIT_SHA
      <<: *upstream
  image: $_IMAGE

# FIXME: font-viewer compiles very fast, however:
#   - We are missing tests for manifests with modules
#     - Since we treat the last module differently, we need to
#       test both with and without added modules in the manifest
#     - It doesn't use any SDK extensions
# FIXME 2: It's also possible to build runtime extensions using the
# template, see vala-nightly
.flatpak-test-setup:
  extends: ".custom image policy"
  variables:
    # This is different than the Upstream yaml, as it has the gnome-font-viewer subdir added in the path
    MANIFEST_PATH: "gnome-font-viewer/build-aux/flatpak/org.gnome.font-viewerDevel.json"
    FLATPAK_MODULE: "gnome-font-viewer"
  before_script:
    - git clone --depth=1 https://gitlab.gnome.org/gnome/gnome-font-viewer.git

# Copy from the font-viewer ci yaml
.flatpak-common:
  extends: [".flatpak@x86_64", ".flatpak-test-setup"]

.flatpak-common@aarch64:
  extends: [".flatpak@aarch64", ".flatpak-test-setup"]

flatpak-with-dist:
  extends: [".flatpak-common"]
  variables:
    MESON_DIST: "1"

flatpak-with-dist@aarch64:
  extends: [".flatpak-common@aarch64"]
  variables:
    MESON_DIST: "1"

# Manually clone and manually cd into the directory
# This is to make sure relative paths and all work
# It's expected that artifacts will throw warnings and
# not extract in this job, as they are in a subdirectory
flatpak-from-root-kinda:
  extends: [".flatpak-common"]
  variables:
    MESON_DIST: "1"
    MANIFEST_PATH: "build-aux/flatpak/org.gnome.font-viewerDevel.json"
  script:
    - cd gnome-font-viewer
    - !reference [".flatpak", "script"]

flatpak-no-dist:
  extends: [".flatpak-common"]
  variables:
    MESON_DIST: "0"

flatpak-no-gitlab-metadata:
  extends: [".flatpak-common"]
  variables:
    ADD_GITLAB_METADATA: "0"
    # Make it faster
    MESON_DIST: "0"
    RUN_TESTS: "0"

flatpak-no-dist-no-tests:
  extends: [".flatpak-common"]
  variables:
    MESON_DIST: "0"
    RUN_TESTS: "0"

flatpak-libadwaita-demo:
  extends: [".flatpak@x86_64", ".custom image policy"]
  variables:
    MANIFEST_PATH: 'demo/org.gnome.Adwaita1.Demo.json'
    FLATPAK_MODULE: 'libadwaita'
  before_script:
    - git clone --depth=1 https://gitlab.gnome.org/gnome/libadwaita.git
  script:
    - cd libadwaita
    - !reference [".flatpak", "script"]

flatpak-libpanel:
  extends: [".flatpak@x86_64", ".custom image policy"]
  variables:
    FLATPAK_MODULE: "libpanel"
    MANIFEST_PATH: "org.gnome.libpanel.demo.json"
    CONFIG_OPTS: "-Ddocs=enabled -Dinstall-examples=true"
    # Make it faster
    MESON_DIST: "0"
    RUN_TESTS: "0"
  before_script:
    - git clone --depth=1 https://gitlab.gnome.org/gnome/libpanel.git
  script:
    - cd libpanel
    - !reference [".flatpak", "script"]

flatpak-contacts:
  extends: [".flatpak@x86_64", ".custom image policy"]
  variables:
    FLATPAK_MODULE: "gnome-contacts"
    MANIFEST_PATH: 'build-aux/flatpak/org.gnome.Contacts.Devel.json'
    # Make it faster
    MESON_DIST: "0"
    RUN_TESTS: "0"
  before_script:
    - git clone --depth=1 https://gitlab.gnome.org/gnome/gnome-contacts.git
  script:
    - cd gnome-contacts
    - !reference [".flatpak", "script"]

flatpak-nautilus:
  extends: [".flatpak@x86_64", ".custom image policy"]
  variables:
    MANIFEST_PATH: "build-aux/flatpak/org.gnome.Nautilus.json"
    FLATPAK_MODULE: "nautilus"
    # Only keep one runtime_repo override and otherwise
    # leave the rest of the tests to the default
    RUNTIME_REPO: "https://nightly.gnome.org/gnome-nightly.flatpakrepo"
    REPO_URL: "https://nightly.gnome.org/repo"
    # Same for the app_id
    APP_ID: "org.gnome.Nautilus.Devel"
    # Used in the test-flatpak-bundle job
    BUNDLE: "nautilus-dev.flatpak"
  before_script:
    - git clone --depth=1 https://gitlab.gnome.org/gnome/nautilus.git
  script:
    - cd nautilus
    - !reference [".flatpak", "script"]

test-flatpak-bundle-and-repo:
  image: "quay.io/gnome_infrastructure/gnome-runtime-images:gnome-master"
  stage: "Flatpak app"
  tags:
    - flatpak
  needs:
    - "flatpak-no-dist-no-tests"
    - "flatpak-nautilus"
  script:
    # Make sure the repo can be extracted and its
    # of the expected structure
    - tar --extract --file repo.tar
    - ls -lh repo/
    - cat repo/config

    # Handcoded BUNDLE var
    - ls -lh nautilus-dev.flatpak
    - ls -lh nautilus-dev.flatpak.sha256sum

    # Default autogenerated one
    - ls -lh ${CI_PROJECT_NAME}*.flatpak
    - ls -lh ${CI_PROJECT_NAME}*.flatpak.sha256sum

    - ls .

    - export FLATPAK_SYSTEM_HELPER_ON_SESSION=foo
    - flatpak -vvv install -y --user --no-pull ${CI_PROJECT_NAME}*.flatpak
    - flatpak -vvv install -y --user --no-pull nautilus-dev.flatpak

test-flatpak-dist:
  image: "quay.io/gnome_infrastructure/gnome-build-meta:sdk-nightly"
  tags:
    - "x86_64_v3"
  stage: "Flatpak app"
  needs: ["flatpak-with-dist"]
  variables:
    FLATPAK_MODULE: "gnome-font-viewer"
  script:
    # Test that we extract logs and dist from the builddirs
    - ls -l --human-readable --recursive .flatpak-builder/build/${FLATPAK_MODULE}*/_flatpak_build/meson-logs/
    - ls -l --human-readable --recursive .flatpak-builder/build/${FLATPAK_MODULE}/_flatpak_build/meson-dist/

    # This is the default TARBALL_ARTIFACT_PATH we recommend in the old docs and has to keep working
    # The docs mention ${CI_PROJECT_NAME}-${CI_COMMIT_TAG}.tar.xz but we will use a wildcards instead
    - ls -lh .flatpak-builder/build/${FLATPAK_MODULE}/_flatpak_build/meson-dist/*.tar.xz
    - ls -lh public-dist/*.tar.xz*
    # Make sure we can decompress the archive
    - tar --verbose --extract --file public-dist/*.tar.xz

    # Rename the tarball for the release-service tests
    #
    # The idea is that on every commit we will possibly want to test the
    # release service template and thus we need a version that will be
    # incrementing on its own. To that end use the Pipeline Intenral ID.
    # Additionally, the release service will only parse the gnome-like
    # version schemes. To that end we will use .alpha.0 for the flatpak tarball
    # and .alpha.1 for the basic-ci tarball
    #
    # https://gitlab.gnome.org/Infrastructure/openshift-images/gnome-release-service/-/blob/8744cfa644f6f19d718623a1892a775d99d18a03/gnome_release_service/gnome_release_system/modules/module_release.py#L63-98
    - COMMITS_TOTAL=$(git rev-list HEAD --count)
    - version="01.$CI_PIPELINE_IID.alpha.0"
    - mv public-dist/gnome-font-viewer-*.tar.xz public-dist/gnome-font-viewer-$version.tar.xz
    - mv public-dist/gnome-font-viewer-*.tar.xz.sha256sum public-dist/gnome-font-viewer-$version.tar.xz.sha256sum
    - ls -al public-dist/
  artifacts:
    access: "developer"
    expire_in: "2 days"
    when: "always"
    paths:
      - "public-dist"

test-flatpak-docs-generation:
  needs: ["flatpak-libpanel"]
  stage: "Flatpak app"
  script:
    - ls -lh "$CI_PROJECT_DIR/${CI_PROJECT_NAME}-docs.tar.gz"
    - tar --extract --file $CI_PROJECT_DIR/${CI_PROJECT_NAME}-docs.tar.gz
    - ls -alhR panel-1.0
