include:
  # include the component located in the current project from the current SHA
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/gnomeos-basic-ci@$CI_COMMIT_SHA
    inputs:
      job-name: "basic-ci-default"
      job-stage: "GNOMEOS Basic CI"
      meson-sourcedir: "gnome-font-viewer"
      before-script: "git clone --depth=1 https://gitlab.gnome.org/gnome/gnome-font-viewer.git"
      goblint: "enabled"
      # Doesn't have any tests other than validate appdata
      asan: "disabled"
      lsan: "disabled"
      tsan: "disabled"
      ubsan: "disabled"
      grcov-c: "disabled"
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/gnomeos-basic-ci@$CI_COMMIT_SHA
    inputs:
      job-name: "basic-ci-default-calendar"
      job-stage: "GNOMEOS Basic CI"
      meson-sourcedir: "gnome-calendar"
      before-script: "git clone --depth=1 https://gitlab.gnome.org/gnome/gnome-calendar.git"
      grcov-c-options: "--ignore tests/**/*"
      goblint: "enabled"
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/gnomeos-basic-ci@$CI_COMMIT_SHA
    inputs:
      job-name: "basic-ci-no-tests"
      job-stage: "GNOMEOS Basic CI"
      meson-sourcedir: "gnome-font-viewer"
      before-script: "git clone --depth=1 https://gitlab.gnome.org/gnome/gnome-font-viewer.git"
      run-tests: "no"
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/gnomeos-basic-ci@$CI_COMMIT_SHA
    inputs:
      job-name: "basic-ci-no-before-script"
      job-stage: "GNOMEOS Basic CI"
      run-tests: "no"
      clang: "disabled"
      scan-build: "disabled"
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/gnomeos-basic-ci@$CI_COMMIT_SHA
    inputs:
      job-name: "basic-ci-with-meson-args"
      job-stage: "GNOMEOS Basic CI"
      meson-sourcedir: "gnome-font-viewer"
      meson-options: "-Dprofile=development"
      before-script: "git clone --depth=1 https://gitlab.gnome.org/gnome/gnome-font-viewer.git"
      # only need one of them to test
      tsan: "disabled"
      ubsan: "disabled"
      grcov-c: "disabled"
      scan-build: "disabled"
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/gnomeos-basic-ci@$CI_COMMIT_SHA
    inputs:
      job-name: "basic-ci-fedora"
      job-stage: "GNOMEOS Basic CI"
      meson-sourcedir: "gnome-font-viewer"
      before-script: "bash ./test-the-templates/basic-ci-fedora-before-script.sh"
      image-ref: "fedora:latest"
      asan: "disabled"
      lsan: "disabled"
      tsan: "disabled"
      ubsan: "disabled"
      grcov-c: "disabled"
      scan-build: "disabled"
      goblint: "disabled"
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/gnomeos-basic-ci@$CI_COMMIT_SHA
    inputs:
      job-name: "basic-ci-ubuntu"
      job-stage: "GNOMEOS Basic CI"
      meson-sourcedir: "gnome-font-viewer"
      before-script: "bash ./test-the-templates/basic-ci-ubuntu-before-script.sh"
      image-ref: "ubuntu:latest"
      asan: "disabled"
      lsan: "disabled"
      tsan: "disabled"
      ubsan: "disabled"
      grcov-c: "disabled"
      scan-build: "disabled"
      goblint: "disabled"
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/gnomeos-basic-ci@$CI_COMMIT_SHA
    inputs:
      job-name: "basic-ci-default-libadwaita"
      job-stage: "GNOMEOS Basic CI"
      meson-sourcedir: "libadwaita"
      before-script: "git clone --depth=1 https://gitlab.gnome.org/gnome/libadwaita.git"
      generate-extensions: "enabled"
      run-tests: "no"
      clang: "disabled"
      grcov-c: "disabled"
      scan-build: "disabled"
      goblint: "disabled"
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/gnomeos-basic-ci@$CI_COMMIT_SHA
    inputs:
      job-name: "basic-ci-default-mutter"
      job-stage: "GNOMEOS Basic CI"
      meson-sourcedir: "mutter"
      before-script: >-
        git clone --depth=1 https://gitlab.gnome.org/gnome/mutter.git &&
        cd mutter &&
        .gitlab-ci/install-gnomeos-sysext-dependencies.sh "${CI_PROJECT_DIR}/$CI_PROJECT_NAME" &&
        cd "${CI_PROJECT_DIR}"
      generate-extensions: "enabled"
      run-tests: "no"
      clang: "disabled"
      grcov-c: "disabled"
      scan-build: "disabled"
      goblint: "disabled"

  # Test Docs generation for gidocgen and gtk-doc
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/gnomeos-basic-ci@$CI_COMMIT_SHA
    inputs:
      job-name: "basic-ci-libpanel"
      job-stage: "GNOMEOS Basic CI"
      meson-options: "-Ddocs=enabled -Dinstall-examples=true"
      meson-sourcedir: "libpanel"
      before-script: "git clone --depth=1 https://gitlab.gnome.org/gnome/libpanel.git"
      run-tests: "no"
      clang: "disabled"
      scan-build: "disabled"
      goblint: "disabled"
      generate-extensions: "disabled"
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/gnomeos-basic-ci@$CI_COMMIT_SHA
    inputs:
      job-name: "basic-ci-gnome-desktop"
      job-stage: "GNOMEOS Basic CI"
      meson-options: "-Dgtk_doc=true"
      meson-sourcedir: "gnome-desktop"
      before-script: "git clone --depth=1 https://gitlab.gnome.org/gnome/gnome-desktop.git"
      run-tests: "no"
      clang: "disabled"
      scan-build: "disabled"
      goblint: "disabled"
      generate-extensions: "disabled"
    
  # Test the release service sandbox
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/release-service@$CI_COMMIT_SHA
    inputs:
      job-name: "release-service-basic-ci"
      dist-job-name: "test-basic-ci-dist"
      service-url: "https://gnome-release-route-sandbox-gnome-release-service.apps.openshift.gnome.org"

# Override the jobs, gitlab should "merge" them so we can add the allow_failure
basic-ci-ubuntu:
  # We often get 403s in the CI runner while trying to install things
  # Error: Failed to fetch http://archive.ubuntu.com/ubuntu/pool/main/libx/libxcb/libxcb-shm0_1.17.0-2_amd64.deb  403  Forbidden [IP: 185.125.190.82 80]
  allow_failure: true

# In general distro jobs start failing when we update some dependency in an app,
# like libadwaita to an unstable/unpackaged version. Mark them allow_failure and
# only keep the jobs as an indication for how things are going.
basic-ci-ubuntu-clang:
  allow_failure: true

basic-ci-fedora:
  allow_failure: true

basic-ci-fedora-clang:
  allow_failure: true

# Test that when we don't specify a before script
# the template does not explode.
# Without a before-script we can't test an app (unless add one in the repo)
# but that's fine, as we only care about gitlab complaining
basic-ci-no-before-script:
  script: "echo Hello world"

basic-ci-default-gobject-linter:
  # Override the rules since we don't have any .c/.h or the config file atm
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  # Also override the before-scipt as we had to disable it
  # See https://gitlab.gnome.org/GNOME/citemplates/-/merge_requests/172
  before_script: "git clone --depth=1 https://gitlab.gnome.org/gnome/gnome-font-viewer.git"

test-basic-ci-docs-generation:
  needs: ["basic-ci-libpanel"]
  stage: "GNOMEOS Basic CI"
  script:
    - ls -lh "$CI_PROJECT_DIR/${CI_PROJECT_NAME}-docs.tar.gz"
    - tar --extract --file $CI_PROJECT_DIR/${CI_PROJECT_NAME}-docs.tar.gz
    - ls -alhR panel-1.0

test-basic-ci-gtk-doc-generation:
  stage: "GNOMEOS Basic CI"
  needs: ["basic-ci-gnome-desktop"]
  script:
    - ls -lh "$CI_PROJECT_DIR/${CI_PROJECT_NAME}-docs.tar.gz"
    - tar --extract --file $CI_PROJECT_DIR/${CI_PROJECT_NAME}-docs.tar.gz
    - ls -alh html/
    - ls -alhR html/gnome-desktop3

test-basic-ci-dist:
  image: "quay.io/gnome_infrastructure/gnome-build-meta:sdk-nightly"
  stage: "GNOMEOS Basic CI"
  tags:
    - "x86_64_v3"
  needs: ["basic-ci-default"]
  script:
    - ls -lh public-dist/*.tar.xz*
    # Make sure we can decompress the archive
    - tar --verbose --extract --file public-dist/*.tar.xz

    # Rename the tarball for the release-service tests
    - COMMITS_TOTAL=$(git rev-list HEAD --count)
    - version="01.$CI_PIPELINE_IID.alpha.1"
    - mv public-dist/gnome-font-viewer-*.tar.xz public-dist/gnome-font-viewer-$version.tar.xz
    - mv public-dist/gnome-font-viewer-*.tar.xz.sha256sum public-dist/gnome-font-viewer-$version.tar.xz.sha256sum
    - ls -al public-dist/
  artifacts:
    access: "developer"
    expire_in: "2 days"
    when: "always"
    paths:
      - "public-dist"
